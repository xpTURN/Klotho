name: Check

# Verifies pushed source: builds and runs the .NET test suites, and checks that the
# committed dist/ addon and the version manifests are in sync with the source.
# Unity EditMode suites (see Tools/run-all-tests.sh) are not run here — they need a
# licensed editor.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - '*.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # KlothoGenerator.Tests targets net10.0; everything else targets net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Klotho.Tests.sln is gitignored, so the projects are listed explicitly.
      # Keep this list in sync with DOTNET_TEST_PROJECTS in Tools/run-all-tests.sh.
      - name: Build & test
        run: |
          set -uo pipefail
          projects=(
            "Tools/KlothoGenerator.Tests/KlothoGenerator.Tests.csproj"
            "Samples/Klotho.Runtime.Tests/Klotho.Runtime.Tests.csproj"
            "Samples/DevLobbyServer.Tests/DevLobbyServer.Tests.csproj"
          )
          results="${GITHUB_WORKSPACE}/Logs/test-results"
          mkdir -p "${results}"
          overall=0
          for proj in "${projects[@]}"; do
            name="$(basename "$(dirname "${proj}")")"
            echo "::group::${name}"
            dotnet test "${proj}" \
              -c Release \
              --results-directory "${results}" \
              --logger "trx;LogFileName=dotnet-${name}.trx" || overall=1
            echo "::endgroup::"
          done

          # Second pass, Debug, for the one project that has build-gated tests. The dev-only
          # detectors (FilterMutationGuard, the ApplyFullState leak checks) hang off
          # DEBUG/UNITY_EDITOR, and [Conditional] removes the CALL, not the
          # method — so a Release-only run compiles their call sites away and asserts nothing
          # about them. Their fixtures are #if-gated to match, which keeps Release green but
          # also silent; this run is what actually exercises them. Scoped to one project on
          # purpose: doing it for all three would double the job for no extra coverage.
          echo "::group::Klotho.Runtime.Tests (Debug)"
          dotnet test "Samples/Klotho.Runtime.Tests/Klotho.Runtime.Tests.csproj" \
            -c Debug \
            --results-directory "${results}" \
            --logger "trx;LogFileName=dotnet-Klotho.Runtime.Tests-Debug.trx" || overall=1
          echo "::endgroup::"

          exit ${overall}

      # Job logs need repo admin rights to download, so surface the failed test
      # names as annotations + job summary instead.
      - name: Summarize test results
        if: always()
        run: .github/scripts/summarize-trx.py Logs/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Logs/test-results/*.trx
          if-no-files-found: warn

  pack-verify:
    name: dist/ addon is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # release.yml zips the committed dist/addons/ as-is, so a stale dist/ would ship.
      - name: Regenerate the addon and diff it against dist/
        run: .github/scripts/check-dist-sync.sh

  sidecar-check:
    name: Asset sidecars are complete
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A .cs without its .cs.meta is invisible to Unity: the generated csproj omits it and the
      # assembly stops compiling, while dotnet builds and tests stay green because they never
      # read .meta. That exact combination has happened once: a new navigation source file was
      # committed without its .cs.meta and only Unity noticed, long after the fact.
      - name: Check .meta / .cs.uid
        run: .github/scripts/check-asset-sidecars.sh

  deprecated-defines-check:
    name: No Unity-deprecated defines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Unity 6000.6 warns on DEVELOPMENT_BUILD / UNITY_64 (UAC0009 / UAC0008) and Unity 6.8 makes them
      # compile errors — even inside an inactive #else. CI never runs Unity, so this is what fails when
      # one comes back, in C# sources or in the committed Godot addon DLLs (check-dist-sync skips DLLs).
      - name: Check DEVELOPMENT_BUILD / UNITY_64
        run: .github/scripts/check-deprecated-defines.sh

  version-check:
    name: Version manifests agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check versions
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            .github/scripts/check-versions.sh --tag "${GITHUB_REF_NAME}"
          else
            .github/scripts/check-versions.sh
          fi
